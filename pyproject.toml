[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canon-ij-maint"
version = "0.1.0"
description = "Deep clean, clean and nozzle-check Canon PIXMA inkjet printers from Linux, without Canon's driver."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Nizar" }]
keywords = ["canon", "pixma", "printer", "deep cleaning", "print head", "linux", "cups", "megatank", "g3010"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]

[project.urls]
Homepage = "https://nizarmah.github.io/canon-ij-maint/"
Source = "https://github.com/nizarmah/canon-ij-maint"
Issues = "https://github.com/nizarmah/canon-ij-maint/issues"

[project.scripts]
canon-ij-maint = "canon_ij_maint:main"

[tool.setuptools]
py-modules = ["canon_ij_maint"]
